<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daylight — Daily Tasks</title><style>
:root{--green:#326b52;--mint:#eaf2eb;--ink:#25332c;--muted:#859087;--line:#e8ece7;--paper:#f6f7f3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.shell{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#fbfcf9;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800;margin:0 0 46px 8px}.logo b{color:var(--green)}.label{font-size:10px;letter-spacing:1.5px;color:#a0aaa2;margin:0 10px 12px}.nav button{width:100%;text-align:left;border:0;border-radius:10px;padding:12px;background:transparent;color:#77827a;font-weight:600;cursor:pointer}.nav button.on,.nav button:hover{background:var(--mint);color:var(--green)}.note{margin-top:auto;background:#f0f4ee;padding:17px;border-radius:13px;color:#718077;line-height:1.6;font-size:12px}.note strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.main{padding:38px clamp(20px,5vw,65px);max-width:1050px;width:100%}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.6px}.avatar{border-radius:50%;background:#e9dacb;padding:12px;color:#795e46;font-weight:bold;letter-spacing:0}.h1{font-size:34px;letter-spacing:-1.2px;margin:28px 0 7px}.sub{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:13px;margin:29px 0}.box{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 8px 28px #203b2a08}.box small{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px;margin-bottom:8px}.box strong{font-size:23px}.prog{display:flex;align-items:center;gap:14px}.circle{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0deg,#e9eee8 0);position:relative;font-size:11px;font-weight:bold}.circle:before{content:'';position:absolute;inset:5px;background:white;border-radius:50%}.circle span{position:relative}.head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.head h2{font-size:17px;margin:0}.add{border:0;background:var(--green);color:white;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}.filters{display:flex;gap:7px;margin-bottom:15px}.filter{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:white;color:#7d887f;cursor:pointer}.filter.on{background:var(--mint);color:var(--green);border-color:#cfe0d2}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:15px;background:white;border:1px solid var(--line);border-radius:12px}.task:hover{border-color:#cbd9ce}.check{width:19px;height:19px;border:1px solid #bdc9bf;border-radius:6px;background:white;cursor:pointer;flex:none}.task.done .check{background:var(--green);color:white}.task.done .check:after{content:'✓'}.body{flex:1}.title{font-weight:bold}.done .title{text-decoration:line-through;color:#9da79f}.meta{font-size:10px;color:var(--muted);margin-top:7px;display:flex;gap:10px}.tag{background:#f1f4ef;padding:4px 8px;border-radius:12px}.high{color:#c66c58}.medium{color:#c58b3f}.low{color:#619276}.due{font-size:11px;color:#879189;white-space:nowrap}.del{border:0;background:none;color:#aeb7af;font-size:18px;cursor:pointer}.empty{text-align:center;padding:36px;background:white;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.back{position:fixed;inset:0;background:#17271d66;display:none;place-items:center;padding:18px}.back.show{display:grid}.modal{background:white;padding:24px;border-radius:17px;width:min(430px,100%);box-shadow:0 20px 60px #15231a40}.modal h2{margin:0 0 18px}.form{display:grid;gap:13px}.form label{font-size:11px;font-weight:bold;color:#68736b;display:grid;gap:6px}.form input,.form select{font:14px Arial;padding:11px;border:1px solid var(--line);border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.cancel{padding:10px 14px;border:1px solid var(--line);background:white;border-radius:8px;cursor:pointer}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#263b30;color:white;padding:11px 16px;border-radius:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;padding:13px 17px;display:block;border-right:0;border-bottom:1px solid var(--line)}.logo{margin:0}.nav,.label,.note{display:none}.main{padding:24px 17px}.stats{grid-template-columns:1fr 1fr}.prog{grid-column:1/-1}.h1{font-size:29px}.due{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><b>✳</b> daylight</div><div class="label">WORKSPACE</div><div class="nav"><button data-view="Today" class="on">◷ &nbsp; Today</button><button data-view="Upcoming">▦ &nbsp; Upcoming</button><button data-view="All tasks">☷ &nbsp; All tasks</button><button data-view="Completed">✓ &nbsp; Completed</button></div><div class="note"><strong>A little progress adds up.</strong>Pick one thing and begin. Your day is yours to shape.</div></aside><main class="main"><div class="top"><span id="date"></span><span class="avatar">KY</span></div><h1 class="h1">Good day, Krishna ☀️</h1><p class="sub">Make room for what matters today.</p><section class="stats"><div class="box prog"><div class="circle" id="circle"><span id="pct">0%</span></div><div><small>DAILY PROGRESS</small><strong id="progress">0 of 0 tasks</strong></div></div><div class="box"><small>TO DO</small><strong id="todo">0</strong></div><div class="box"><small>DONE</small><strong id="done">0</strong></div></section><div class="head"><h2 id="listTitle">Today</h2><div style="display:flex;gap:8px"><button class="cancel" id="enableReminders" type="button">♢ Enable reminders</button><button class="add" id="open">＋ New task</button></div></div><div class="filters"><button class="filter on" data-filter="All">All tasks</button><button class="filter" data-filter="High">High priority</button><button class="filter" data-filter="Work">Work</button><button class="filter" data-filter="Personal">Personal</button></div><div class="tasks" id="tasks"></div></main></div><div class="back" id="back"><div class="modal"><h2 id="modalTitle">Add a task</h2><form class="form" id="form"><input type="hidden" id="editId"><label>Task name<input id="name" required maxlength="90" placeholder="What would you like to get done?"></label><div class="row"><label>Due date<input id="due" type="date"></label><label>Time<input id="time" type="time"></label><label>Priority<select id="priority"><option>Medium</option><option>High</option><option>Low</option></select></label></div><label>Category<select id="category"><option>Personal</option><option>Work</option><option>Study</option><option>Health</option></select></label><div class="actions"><button type="button" class="cancel" id="close">Cancel</button><button class="add" id="saveTask">Add task</button></div></form></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),now=new Date(),key=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=key(now);$('#date').textContent=now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();let tasks;try{tasks=JSON.parse(localStorage.getItem('daylight'))}catch{}if(!Array.isArray(tasks))tasks=[{id:1,title:'Plan the week and set priorities',category:'Personal',priority:'High',due:today,done:false},{id:2,title:'Review class notes for today',category:'Study',priority:'Medium',due:today,done:false},{id:3,title:'Take a short walk and reset',category:'Health',priority:'Low',due:today,done:false},{id:4,title:'Reply to important messages',category:'Personal',priority:'Medium',due:today,done:true}];let view='Today',filter='All';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('daylight',JSON.stringify(tasks))}function formatTime(v){let [h,m]=v.split(':');return new Date(2000,0,1,+h,+m).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}function ping(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}function render(){let td=tasks.filter(x=>x.due===today),finished=td.filter(x=>x.done).length,p=td.length?Math.round(finished/td.length*100):0;$('#pct').textContent=p+'%';$('#circle').style.background=`conic-gradient(#326b52 ${p*3.6}deg,#e9eee8 0)`;$('#progress').textContent=`${finished} of ${td.length} tasks`;$('#todo').textContent=td.length-finished;$('#done').textContent=finished;let shown=tasks.filter(x=>view==='Today'?x.due===today:view==='Upcoming'?x.due>today:view==='Completed'?x.done:true);if(filter==='High')shown=shown.filter(x=>x.priority==='High');if(['Work','Personal'].includes(filter))shown=shown.filter(x=>x.category===filter);shown.sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'').localeCompare(b.due||''));$('#listTitle').textContent=view;$('#tasks').innerHTML=shown.length?shown.map(x=>`<article class="task ${x.done?'done':''}"><button class="check" aria-label="Toggle completion" data-check="${x.id}"></button><div class="body"><div class="title">${esc(x.title)}</div><div class="meta"><span class="tag">${esc(x.category)}</span><span class="${x.priority.toLowerCase()}">${x.priority} priority</span></div></div><span class="due">${x.due===today?'Today':x.due?new Date(x.due+'T12:00:00').toLocaleDateString('en-IN',{month:'short',day:'numeric'}):'No date'}${x.time?' · '+formatTime(x.time):''}</span><button class="cancel" aria-label="Edit task" data-edit="${x.id}" style="padding:7px 10px">Edit</button><button class="del" aria-label="Delete" data-del="${x.id}">×</button></article>`).join(''):'<div class="empty">Nothing on this list yet. Add a task to get started.</div>';document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let t=tasks.find(x=>x.id==b.dataset.check);t.done=!t.done;save();render();if(t.done)ping('Nice work — task completed')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(x=>x.id!=b.dataset.del);save();render()})}$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.edit);if(!t)return;$('#editId').value=t.id;$('#name').value=t.title;$('#due').value=t.due||'';$('#time').value=t.time||'';$('#priority').value=t.priority;$('#category').value=t.category;$('#modalTitle').textContent='Edit task';$('#saveTask').textContent='Save changes';$('#back').classList.add('show');$('#name').focus()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.edit);if(!t)return;$('#editId').value=t.id;$('#name').value=t.title;$('#due').value=t.due||'';$('#time').value=t.time||'';$('#priority').value=t.priority;$('#category').value=t.category;$('#modalTitle').textContent='Edit task';$('#saveTask').textContent='Save changes';$('#back').classList.add('show');$('#name').focus()});document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});$('#open').onclick=()=>{$('#back').classList.add('show');$('#name').focus()};$('#close').onclick=()=>$('#back').classList.remove('show');$('#back').onclick=e=>{if(e.target===$('#back'))$('#back').classList.remove('show')};$('#due').value=today;$('#form').onsubmit=e=>{e.preventDefault();const editingId=$('#editId').value;const values={title:$('#name').value.trim(),category:$('#category').value,priority:$('#priority').value,due:$('#due').value,time:$('#time').value};if(editingId){Object.assign(tasks.find(x=>String(x.id)===editingId),values)}else tasks.unshift({id:Date.now(),...values,done:false});save();e.target.reset();$('#due').value=today;$('#back').classList.remove('show');view='Today';$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.edit);if(!t)return;$('#editId').value=t.id;$('#name').value=t.title;$('#due').value=t.due||'';$('#time').value=t.time||'';$('#priority').value=t.priority;$('#category').value=t.category;$('#modalTitle').textContent='Edit task';$('#saveTask').textContent='Save changes';$('#back').classList.add('show');$('#name').focus()});document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view==='Today'));render();ping(editing?'Changes saved':'Task added to your day')};render();
$('#enableReminders').onclick=async()=>{try{alarmCtx=new(window.AudioContext||window.webkitAudioContext)();await alarmCtx.resume()}catch{}localStorage.setItem('daylight-reminders','on');if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}$('#enableReminders').textContent='✓ Alarms on';ping('Alarm sound is enabled while this page stays open')};function alarm(){if(!alarmCtx)return;const o=alarmCtx.createOscillator(),g=alarmCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(alarmCtx.destination);o.start();o.stop(alarmCtx.currentTime+.45)}function checkReminders(){if(localStorage.getItem('daylight-reminders')!=='on')return;const n=new Date();for(const t of tasks){if(t.done||!t.time||!t.due)continue;const when=new Date(t.due+'T'+t.time),id=`${t.id}-${t.due}-${t.time}`;if(n>=when&&!localStorage.getItem('daylight-fired-'+id)){localStorage.setItem('daylight-fired-'+id,'1');alarm();if('Notification'in window&&Notification.permission==='granted')new Notification('Task reminder',{body:t.title});ping('Reminder: '+t.title)}}}if(localStorage.getItem('daylight-reminders')==='on')$('#enableReminders').textContent='✓ Reminders on';setInterval(checkReminders,10000);
$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.edit);if(!t)return;editingTaskId=String(t.id);$('#name').value=t.title;$('#due').value=t.due||'';$('#time').value=t.time||'';$('#priority').value=t.priority;$('#category').value=t.category;$('#modalTitle').textContent='Edit task';$('#saveTask').textContent='Save changes';$('#back').classList.add('show');$('#name').focus()});$('#open').onclick=()=>{editingTaskId=null;$('#form').reset();$('#due').value=today;$('#modalTitle').textContent='Add a task';$('#saveTask').textContent='Add task';$('#back').classList.add('show');$('#name').focus()};$('#form').onsubmit=e=>{e.preventDefault();const values={title:$('#name').value.trim(),category:$('#category').value,priority:$('#priority').value,due:$('#due').value,time:$('#time').value};if(editingTaskId){const t=tasks.find(x=>String(x.id)===editingTaskId);if(t)Object.assign(t,values)}else tasks.unshift({id:Date.now(),...values,done:false});save();editingTaskId=null;$('#back').classList.remove('show');$('#form').reset();$('#due').value=today;$('#modalTitle').textContent='Add a task';$('#saveTask').textContent='Add task';render();ping('Task saved')};let alarmCtx;$('#enableReminders').onclick=async()=>{try{alarmCtx=new(window.AudioContext||window.webkitAudioContext)();await alarmCtx.resume()}catch{}localStorage.setItem('daylight-reminders','on');if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}$('#enableReminders').textContent='✓ Alarms on';ping('Alarm sound enabled. Keep this page open for reminders.')};alarm=()=>{if(!alarmCtx)return;const play=()=>{for(let i=0;i<3;i++){const o=alarmCtx.createOscillator(),g=alarmCtx.createGain(),start=alarmCtx.currentTime+i*.55;o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,start);g.gain.linearRampToValueAtTime(.18,start+.03);g.gain.exponentialRampToValueAtTime(.001,start+.4);o.connect(g);g.connect(alarmCtx.destination);o.start(start);o.stop(start+.42)}};if(alarmCtx.state==='suspended')alarmCtx.resume().then(play);else play()};if(localStorage.getItem('daylight-reminders')==='on')$('#enableReminders').textContent='✓ Alarms on';</script></body></html>
